apiVersion: batch/v1
kind: CronJob
metadata:
  name: dyndns
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # The next scheduled run is the retry. A container restart could mask the failure.
      backoffLimit: 0
      # Includes image pull time. A cold Docker Hub pull has taken 4 minutes.
      activeDeadlineSeconds: 420
      template:
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/arch: amd64
          containers:
          - name: dyndns
            image: politeauthority/dyndns:0.1.0
            imagePullPolicy: IfNotPresent
            env:
            - name: DOMAIN_FILE
              value: /config/domains.json
            - name: DRY_RUN
              value: "false"
            - name: QUIGLEY_URL
              value: http://quigley-api.quigley-api.svc
            - name: QUIGLEY_USER
              valueFrom:
                secretKeyRef:
                  name: dyndns-notify
                  key: QUIGLEY_USER
                  optional: true
            - name: QUIGLEY_KEY
              valueFrom:
                secretKeyRef:
                  name: dyndns-notify
                  key: QUIGLEY_KEY
                  optional: true
            resources:
              requests:
                cpu: 10m
                memory: 48Mi
              limits:
                memory: 128Mi
            volumeMounts:
            - name: domain-config
              mountPath: /config
              readOnly: true
          volumes:
          - name: domain-config
            secret:
              secretName: domain-config
