apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dyndns
resources:
  - ../../base
  # domain-config is created by hand on this cluster and isn't managed from this file.
  # - sealed-secret-domains.yaml
patches:
  # Stay on Docker Hub. harbor.alix.lol depends on the DNS this job maintains.
  - target:
      kind: CronJob
    patch: |-
      - op: add
        path: /spec/jobTemplate/spec/template/spec/imagePullSecrets
        value: [{ name: docker-hub-registry }]
