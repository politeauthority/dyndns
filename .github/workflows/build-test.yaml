name: Build and Test

on:
  pull_request:
  push:
    branches: ["main"]

env:
  IMAGE_VERSION: "0.1.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Kustomize Builds
        run: |
          kustomize build kubernetes-manifests/base/
          kustomize build kubernetes-manifests/env/generic
          kustomize build kubernetes-manifests/env/colfax
          kustomize build kubernetes-manifests/env/dry-run
      - name: Unit Tests
        run: docker build --target test .

  build:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: politeauthority
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build and Push
        run: |
          IMAGE="politeauthority/dyndns:${IMAGE_VERSION}"
          # Never overwrite a released tag. Bump IMAGE_VERSION to ship a new one.
          if docker manifest inspect "${IMAGE}" > /dev/null 2>&1; then
            echo "${IMAGE} already exists, skipping" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          docker build --target release -t "${IMAGE}" .
          docker push "${IMAGE}"
          echo "Built \`${IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
